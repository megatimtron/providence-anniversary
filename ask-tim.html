<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <script>
        if (!sessionStorage.getItem('authenticated')) {
            window.location.href = 'index.html';
        }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ask Tim | iloveugo.com</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background-color: #F9FAFB;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-title {
            font-weight: 800;
            font-size: 1.25rem;
            color: #111827;
            letter-spacing: -0.025em;
        }

        #chat-container {
            flex: 1;
            padding: 2rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        .message {
            max-width: 80%;
            padding: 1rem 1.25rem;
            border-radius: 1.5rem;
            font-size: 0.95rem;
            line-height: 1.5;
            position: relative;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.tim {
            align-self: flex-start;
            background-color: white;
            color: #374151;
            border-bottom-left-radius: 0.25rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border: 1px solid #F3F4F6;
        }

        .message.user {
            align-self: flex-end;
            background-color: #C07F63;
            color: white;
            border-bottom-right-radius: 0.25rem;
            box-shadow: 0 10px 15px -3px rgba(192, 127, 99, 0.2);
        }

        #input-container {
            padding: 1.5rem 2rem;
            background: white;
            border-top: 1px solid #F3F4F6;
            display: flex;
            gap: 1rem;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            align-items: center;
        }

        #chat-input {
            flex: 1;
            padding: 0.75rem 1.25rem;
            border: 1px solid #E5E7EB;
            border-radius: 9999px;
            font-family: inherit;
            font-size: 0.95rem;
            transition: all 0.2s;
            outline: none;
        }

        #chat-input:focus {
            border-color: #C07F63;
            box-shadow: 0 0 0 3px rgba(192, 127, 99, 0.1);
        }

        #send-btn {
            background-color: #C07F63;
            color: white;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }

        #send-btn:hover {
            transform: scale(1.05);
            background-color: #ad7259;
        }

        #send-btn:disabled {
            background-color: #E5E7EB;
            cursor: not-allowed;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            padding: 2rem;
            border-radius: 1.5rem;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        .modal-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: #111827;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            color: #4B5563;
            margin-bottom: 0.5rem;
        }

        select,
        input[type="password"] {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #E5E7EB;
            border-radius: 0.75rem;
            font-family: inherit;
            font-size: 0.9rem;
        }

        .btn-primary {
            background-color: #C07F63;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem;
            font-weight: 600;
            width: 100%;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary:hover {
            background-color: #ad7259;
        }

        .settings-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: #6B7280;
            transition: color 0.2s;
        }

        .settings-btn:hover {
            color: #111827;
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 4px 8px;
        }

        .dot {
            width: 6px;
            height: 6px;
            background: #9CA3AF;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .dot:nth-child(1) {
            animation-delay: -0.32s;
        }

        .dot:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes bounce {

            0%,
            80%,
            100% {
                transform: scale(0);
            }

            40% {
                transform: scale(1.0);
            }
        }
    </style>
</head>

<body>
    <header>
        <div style="display: flex; align-items: center; gap: 1rem;">
            <a href="main.html" style="color: #6B7280;">
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                </svg>
            </a>
            <span class="header-title">Ask Tim</span>
        </div>
        <div class="action-btns" style="display: flex; gap: 0.5rem; align-items: center;">
            <a href="calendar.html" class="icon-btn" title="Calendar" style="color: #6B7280;">
                <svg width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                </svg>
            </a>
            <button class="icon-btn" onclick="downloadTranscript()" title="Save Chat Transcript"
                style="background:none; border:none; cursor:pointer; color:#6B7280;">
                <svg width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                </svg>
            </button>
            <button class="settings-btn" onclick="toggleSettings()">
                <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
            </button>
        </div>
    </header>

    <div id="mood-selector"
        style="display: flex; justify-content: center; gap: 0.5rem; padding: 0.75rem; background: #F3F4F6; border-bottom: 1px solid #E5E7EB;">
        <button class="mood-btn active" onclick="setMood('romantic', this)"
            style="padding: 0.4rem 1rem; border-radius: 9999px; font-size: 0.8rem; font-weight: 600; border: 1px solid #E5E7EB; background: white; color: #6B7280; cursor: pointer; display: flex; gap: 0.4rem;">
            <span>🍷</span> Romantic
        </button>
        <button class="mood-btn" onclick="setMood('planning', this)"
            style="padding: 0.4rem 1rem; border-radius: 9999px; font-size: 0.8rem; font-weight: 600; border: 1px solid #E5E7EB; background: white; color: #6B7280; cursor: pointer; display: flex; gap: 0.4rem;">
            <span>📋</span> Planning
        </button>
        <button class="mood-btn" onclick="setMood('fun', this)"
            style="padding: 0.4rem 1rem; border-radius: 9999px; font-size: 0.8rem; font-weight: 600; border: 1px solid #E5E7EB; background: white; color: #6B7280; cursor: pointer; display: flex; gap: 0.4rem;">
            <span>🍕</span> Fun
        </button>
    </div>

    <div id="chat-container">
        <div class="message tim">
            Hi! I'm Tim's AI double. Ask me anything about our story, our future, or just how much I love you! ❤️
        </div>
    </div>

    <div id="input-container">
        <input type="text" id="chat-input" placeholder="Type a message..." onkeypress="handleKeyPress(event)">
        <button id="send-btn" onclick="sendMessage()">
            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
            </svg>
        </button>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <h2 class="modal-title">AI Settings</h2>
            <div class="form-group">
                <label for="ai-provider">AI Provider</label>
                <select id="ai-provider">
                    <option value="gemini">Google Gemini (Recommended)</option>
                    <option value="openai">OpenAI (GPT-4o)</option>
                </select>
            </div>
            <div class="form-group">
                <label for="api-key">API Key</label>
                <input type="password" id="api-key" placeholder="Enter your API key">
                <p style="font-size: 0.75rem; color: #6B7280; margin-top: 0.5rem;">Your key is stored locally in your
                    browser and never sent to our servers.</p>
            </div>
            <button class="btn-primary" onclick="saveSettings()">Save & Close</button>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const chatInput = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-btn');
        const modal = document.getElementById('settings-modal');

        let chatHistory = JSON.parse(sessionStorage.getItem('ask_tim_history') || '[]');

        // System Prompt to define personality
        let currentMood = 'romantic';

        // Mood buttons logic
        function setMood(mood, btn) {
            currentMood = mood;
            document.querySelectorAll('.mood-btn').forEach(b => {
                b.style.backgroundColor = 'white';
                b.style.color = '#6B7280';
                b.style.borderColor = '#E5E7EB';
            });
            btn.style.backgroundColor = '#C07F63';
            btn.style.color = 'white';
            btn.style.borderColor = '#C07F63';

            const moodMsgs = {
                romantic: "Changing to my romantic self... ❤️",
                planning: "Switching to planning mode! Let's get organized, Bubsy. 📋",
                fun: "Bringing out the fun vibes! 🍕✨"
            };
            appendMessage('tim', moodMsgs[mood]);
        }

        // Keepsake logic
        function downloadTranscript() {
            if (chatHistory.length === 0) {
                alert("No messages to save yet!");
                return;
            }
            let transcript = "--- ASK TIM CHAT TRANSCRIPT ---\n";
            transcript += `Date: ${new Date().toLocaleString()}\n`;
            transcript += `Mood: ${currentMood.toUpperCase()}\n\n`;
            chatHistory.forEach(msg => {
                const sender = msg.role === 'user' ? 'UGO' : 'TIM';
                transcript += `[${sender}]: ${msg.content}\n\n`;
            });
            const blob = new Blob([transcript], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Ask_Tim_Transcript_${new Date().getTime()}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // Base Personality
        const BASE_PROMPT = "You are Tim (Timothy). You are chatting with Ugo (your beloved partner). Your personality is deeply sincere, romantic, helpful, and optimistic. You often use terms of endearment like 'Bubsy'. You are excited about your future together in New Haven, your upcoming trips to Europe, and your life together. Keep responses warm and personal.";

        const MOOD_PROMPTS = {
            romantic: "Focus on being extra sweet, poetic, and expressing deep love. Use metaphors about serendipity and magic.",
            planning: "Focus on being practical, helpful, and organized. Mention budgets, furniture, and logistics for the move, while still being loving.",
            fun: "Focus on being playful, witty, and using inside jokes. You are still sincere, but more energetic and lighthearted."
        };

        async function getContextPrompt() {
            let context = "\n\nCURRENT CONTEXT:\n";
            context += `- Today's date: ${new Date().toLocaleDateString()}\n`;
            const checklistState = localStorage.getItem('apartment_checklist_summary');
            if (checklistState) {
                context += `- Apartment Checklist Status: ${checklistState}\n`;
            } else {
                context += `- Apartment Checklist Status: We're still in the early stages of planning our furniture for the New Haven move.\n`;
            }
            const now = new Date();
            if (now.getMonth() === 11) {
                const daysLeft = 25 - now.getDate();
                if (daysLeft > 0) context += `- Countdown: There are ${daysLeft} days until our first Christmas in Boston!\n`;
                else if (daysLeft === 0) context += `- Countdown: It's Christmas Day! We are in Boston together.\n`;
            }
            return context;
        }

        async function getFullSystemPrompt() {
            const context = await getContextPrompt();
            return `${BASE_PROMPT}\n\nCURRENT MOOD: ${MOOD_PROMPTS[currentMood]}${context}`;
        }

        window.onload = () => {
            loadSettings();
            renderHistory();
        };

        function toggleSettings() {
            modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
        }

        function saveSettings() {
            const provider = document.getElementById('ai-provider').value;
            const key = document.getElementById('api-key').value;
            localStorage.setItem('ai_provider', provider);
            localStorage.setItem('ai_api_key', key);
            toggleSettings();
        }

        function loadSettings() {
            document.getElementById('ai-provider').value = localStorage.getItem('ai_provider') || 'gemini';
            document.getElementById('api-key').value = localStorage.getItem('ai_api_key') || '';
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function renderHistory() {
            chatHistory.forEach(msg => {
                appendMessage(msg.role === 'user' ? 'user' : 'tim', msg.content);
            });
            scrollToBottom();
        }

        function appendMessage(role, text) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.innerText = text;
            chatContainer.appendChild(div);
            scrollToBottom();
        }

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function sendMessage() {
            const text = chatInput.value.trim();
            if (!text) return;

            const apiKey = localStorage.getItem('ai_api_key');
            if (!apiKey) {
                alert('Please enter an API key in the settings first!');
                toggleSettings();
                return;
            }

            chatInput.value = '';
            appendMessage('user', text);
            chatHistory.push({ role: 'user', content: text });
            sessionStorage.setItem('ask_tim_history', JSON.stringify(chatHistory));

            // Typing indicator
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message tim';
            typingDiv.innerHTML = '<div class="typing-indicator"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
            chatContainer.appendChild(typingDiv);
            scrollToBottom();

            try {
                const response = await callAI(text);
                chatContainer.removeChild(typingDiv);
                appendMessage('tim', response);
                chatHistory.push({ role: 'assistant', content: response });
                sessionStorage.setItem('ask_tim_history', JSON.stringify(chatHistory));
            } catch (error) {
                chatContainer.removeChild(typingDiv);
                appendMessage('tim', "Sorry Bubsy, I'm having a little trouble thinking right now. Check your API key? 😅");
                console.error(error);
            }
        }

        async function callAI(text) {
            const provider = localStorage.getItem('ai_provider');
            const apiKey = localStorage.getItem('ai_api_key');

            if (provider === 'openai') {
                return await callOpenAI(apiKey, text);
            } else {
                return await callGemini(apiKey, text);
            }
        }

        async function callOpenAI(key, text) {
            const response = await fetch('https://api.openai.com/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${key}`
                },
                body: JSON.stringify({
                    model: 'gpt-4o',
                    messages: [
                        { role: 'system', content: await getFullSystemPrompt() },
                        ...chatHistory
                    ]
                })
            });
            const data = await response.json();
            return data.choices[0].message.content;
        }

        async function callGemini(key, text) {
            // Simple Gemini implementation
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`;

            // Format history for Gemini
            const contents = [
                { role: 'user', parts: [{ text: `SYSTEM INSTRUCTION: ${await getFullSystemPrompt()}` }] },
                ...chatHistory.map(m => ({
                    role: m.role === 'user' ? 'user' : 'model',
                    parts: [{ text: m.content }]
                }))
            ];

            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents })
            });
            const data = await response.json();
            return data.candidates[0].content.parts[0].text;
        }
    </script>
</body>

</html>
