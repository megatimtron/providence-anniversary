<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ask Tim | iloveugo.com</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://js.hcaptcha.com/1/api.js" async defer></script>
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            overflow-x: hidden;
            width: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #F9FAFB;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow-y: hidden;
        }

        header {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        @media (min-width: 768px) {
            header {
                padding: 1rem 2rem;
            }
        }

        .header-title {
            font-weight: 800;
            font-size: 1.25rem;
            color: #111827;
            letter-spacing: -0.025em;
        }

        #chat-container {
            flex: 1;
            padding: 1rem;
            overflow-y: auto;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        @media (min-width: 768px) {
            #chat-container {
                padding: 2rem;
            }
        }

        .message {
            max-width: 80%;
            padding: 1rem 1.25rem;
            border-radius: 1.5rem;
            font-size: 0.95rem;
            line-height: 1.5;
            position: relative;
            animation: fadeIn 0.3s ease-out;
            display: flex;
            gap: 0.75rem;
            align-items: flex-start;
        }

        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            flex-shrink: 0;
            object-fit: cover;
            background: #E5E7EB;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.75rem;
            color: #6B7280;
        }

        .message-content {
            flex: 1;
            min-width: 0;
            overflow-wrap: break-word;
            word-wrap: break-word;
        }

        .message-content img {
            max-width: 100%;
            height: auto;
            display: block;
        }

        .message-content pre {
            overflow-x: auto;
            max-width: 100%;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.tim {
            align-self: flex-start;
            background-color: white;
            color: #374151;
            border-bottom-left-radius: 0.25rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border: 1px solid #F3F4F6;
        }

        /* Markdown styling for Tim's messages */
        .message.tim strong {
            font-weight: 700;
            color: #111827;
        }

        .message.tim em {
            font-style: italic;
            color: #C07F63;
        }

        .message.tim ul, .message.tim ol {
            margin: 0.5rem 0;
            padding-left: 1.5rem;
        }

        .message.tim li {
            margin: 0.25rem 0;
        }

        .message.tim code {
            background: #F3F4F6;
            padding: 0.125rem 0.375rem;
            border-radius: 0.25rem;
            font-family: 'Courier New', monospace;
            font-size: 0.875em;
        }

        .message.tim pre {
            background: #F9FAFB;
            padding: 0.75rem;
            border-radius: 0.5rem;
            overflow-x: auto;
            margin: 0.5rem 0;
        }

        .message.tim pre code {
            background: none;
            padding: 0;
        }

        .message.tim blockquote {
            border-left: 3px solid #C07F63;
            padding-left: 1rem;
            margin: 0.5rem 0;
            color: #6B7280;
            font-style: italic;
        }

        .message.tim p {
            margin: 0.5rem 0;
        }

        .message.tim p:first-child {
            margin-top: 0;
        }

        .message.tim p:last-child {
            margin-bottom: 0;
        }

        .message.user {
            align-self: flex-end;
            background-color: #C07F63;
            color: white;
            border-bottom-right-radius: 0.25rem;
            box-shadow: 0 10px 15px -3px rgba(192, 127, 99, 0.2);
        }

        #input-container {
            padding: 1rem;
            background: white;
            border-top: 1px solid #F3F4F6;
            display: flex;
            gap: 0.5rem;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            align-items: center;
        }

        @media (min-width: 768px) {
            #input-container {
                padding: 1.5rem 2rem;
                gap: 1rem;
            }
        }

        #chat-input {
            flex: 1;
            padding: 0.75rem 1.25rem;
            border: 1px solid #E5E7EB;
            border-radius: 9999px;
            font-family: inherit;
            font-size: 0.95rem;
            transition: all 0.2s;
            outline: none;
            color: #111827;
        }

        #chat-input:focus {
            border-color: #C07F63;
            box-shadow: 0 0 0 3px rgba(192, 127, 99, 0.1);
        }

        #send-btn {
            background-color: #C07F63;
            color: white;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }

        #send-btn:hover {
            transform: scale(1.05);
            background-color: #ad7259;
        }

        #send-btn:disabled {
            background-color: #E5E7EB;
            cursor: not-allowed;
        }

        /* Auth Screen Styles */
        .auth-screen {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background: linear-gradient(135deg, #F9F1E6 0%, #F2E2CC 50%, #EAD0B3 100%);
        }

        .auth-screen.hidden {
            display: none;
        }

        .auth-nav {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            padding: 1rem 2rem;
        }

        .auth-nav-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .auth-brand h1 {
            font-size: 1.25rem;
            font-weight: 800;
            color: #111827;
            letter-spacing: -0.025em;
        }

        .auth-brand p {
            font-size: 0.75rem;
            color: #6B7280;
            font-weight: 500;
        }

        .auth-main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .auth-card {
            background: white;
            padding: 2.5rem;
            border-radius: 1.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .auth-logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .auth-logo h1 {
            font-size: 2rem;
            font-weight: 800;
            color: #C07F63;
            margin-bottom: 0.5rem;
        }

        .auth-logo p {
            color: #6B7280;
            font-size: 0.95rem;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            padding: 2rem;
            border-radius: 1.5rem;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        .modal-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: #111827;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            color: #4B5563;
            margin-bottom: 0.5rem;
        }

        select,
        input[type="password"] {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #E5E7EB;
            border-radius: 0.75rem;
            font-family: inherit;
            font-size: 0.9rem;
        }

        .btn-primary {
            background-color: #C07F63;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem;
            font-weight: 600;
            width: 100%;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary:hover {
            background-color: #ad7259;
        }

        .settings-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: #6B7280;
            transition: color 0.2s;
        }

        .settings-btn:hover {
            color: #111827;
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 4px 8px;
        }

        .dot {
            width: 6px;
            height: 6px;
            background: #9CA3AF;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .dot:nth-child(1) {
            animation-delay: -0.32s;
        }

        .dot:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes bounce {

            0%,
            80%,
            100% {
                transform: scale(0);
            }

            40% {
                transform: scale(1.0);
            }
        }

        #image-preview {
            padding: 0.5rem 1rem;
            background: white;
            border-top: 1px solid #F3F4F6;
        }

        @media (min-width: 768px) {
            #image-preview {
                padding: 0.5rem 2rem;
            }
        }

        #preview-img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 0.5rem;
        }

        /* Sidebar Styles */
        .app-container {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        #sidebar {
            width: 260px;
            background: #111827;
            color: white;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
            position: fixed;
            height: 100vh;
            z-index: 200;
        }

        #sidebar.hidden {
            transform: translateX(-100%);
        }

        @media (min-width: 768px) {
            #sidebar {
                position: relative;
            }
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        @media (min-width: 768px) {
            .main-content {
                margin-left: 0;
            }
        }

        .sidebar-header {
            padding: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .new-chat-btn {
            width: 100%;
            padding: 0.75rem;
            background: #C07F63;
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .new-chat-btn:hover {
            background: #ad7259;
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            padding: 0.5rem;
        }

        .chat-item {
            padding: 0.75rem;
            margin-bottom: 0.25rem;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: background 0.2s;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .chat-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .chat-item.active {
            background: rgba(192, 127, 99, 0.3);
        }

        .chat-item-content {
            flex: 1;
            min-width: 0;
        }

        .chat-item-title {
            font-weight: 500;
            font-size: 0.875rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-item-meta {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 0.125rem;
        }

        .delete-chat-btn {
            opacity: 0;
            background: #EF4444;
            color: white;
            border: none;
            border-radius: 0.25rem;
            padding: 0.25rem 0.5rem;
            font-size: 0.75rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .chat-item:hover .delete-chat-btn {
            opacity: 1;
        }

        .menu-toggle {
            display: block;
            background: none;
            border: none;
            color: #6B7280;
            cursor: pointer;
            padding: 0.5rem;
        }

        @media (min-width: 768px) {
            .menu-toggle {
                display: none;
            }

            #sidebar.hidden {
                transform: translateX(0);
            }
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 199;
        }

        .sidebar-overlay.active {
            display: block;
        }

        @media (min-width: 768px) {
            .sidebar-overlay {
                display: none !important;
            }
        }
    </style>
</head>

<body>
    <div class="sidebar-overlay" onclick="toggleSidebar()"></div>

    <div class="app-container">
        <!-- Sidebar -->
        <div id="sidebar" class="hidden">
            <div class="sidebar-header">
                <button class="new-chat-btn" onclick="createNewChat()">

        <!-- Main Content -->
        <div class="main-content">
    <header>
        <div style="display: flex; align-items: center; gap: 1rem;">
            <button class="menu-toggle" onclick="toggleSidebar()">

    <!-- Mood selector removed -->

    <div id="chat-container">
        <div class="message tim">
            Hi! I'm Tim's AI assistant. How can I help you today?
        </div>
    </div>

    <div id="input-container">

        const chatContainer = document.getElementById('chat-container');
        const chatInput = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-btn');
        const modal = document.getElementById('settings-modal');

        let currentUser = null;
        let chatHistory = [];
        let selectedImage = null;
        let isVerified = false; // Track if user has completed captcha
        let pendingMessage = null; // Store message while waiting for captcha

        // Mood selector removed

        // Check if user has been verified in this session
        function checkVerificationStatus() {
            const verified = sessionStorage.getItem('ask_tim_verified');
            if (verified === 'true') {
                isVerified = true;
            }
        }

        // Verify captcha and proceed with pending message
        function verifyCaptcha() {
            const hcaptchaResponse = hcaptcha.getResponse();
            const errorMsg = document.getElementById('captcha-error');

            if (!hcaptchaResponse) {
                errorMsg.textContent = 'Please complete the verification';
                errorMsg.style.display = 'block';
                return;
            }

            // Mark as verified
            isVerified = true;
            sessionStorage.setItem('ask_tim_verified', 'true');

            // Hide modal
            document.getElementById('captcha-modal').style.display = 'none';
            errorMsg.style.display = 'none';

            // Send the pending message
            if (pendingMessage) {
                sendMessageAfterVerification(pendingMessage.text, pendingMessage.image);
                pendingMessage = null;
            }
        }

        // Keepsake logic
        function downloadTranscript() {
            if (chatHistory.length === 0) {
                alert("No messages to save yet!");
                return;
            }
            let transcript = "--- ASK TIM CHAT TRANSCRIPT ---\n";
            transcript += `Date: ${new Date().toLocaleString()}\n\n`;
            chatHistory.forEach(msg => {
                const sender = msg.role === 'user' ? 'USER' : 'ASSISTANT';
                transcript += `[${sender}]: ${msg.content}\n\n`;
            });
            const blob = new Blob([transcript], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Ask_Tim_Transcript_${new Date().getTime()}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // Base Personality
        const BASE_PROMPT = "You are Tim's AI assistant. You are helpful, knowledgeable, and professional. Provide clear and concise responses to questions about planning, logistics, and general topics. Keep responses informative and friendly.";

        async function getContextPrompt() {
            let context = "\n\nCURRENT CONTEXT:\n";
            context += `- Today's date: ${new Date().toLocaleDateString()}\n`;
            const checklistState = localStorage.getItem('apartment_checklist_summary');
            if (checklistState) {
                context += `- Apartment Checklist Status: ${checklistState}\n`;
            } else {
                context += `- Apartment Checklist Status: We're still in the early stages of planning our furniture for the New Haven move.\n`;
            }
            const now = new Date();
            if (now.getMonth() === 11) {
                const daysLeft = 25 - now.getDate();
                if (daysLeft > 0) context += `- Countdown: There are ${daysLeft} days until our first Christmas in Boston!\n`;
                else if (daysLeft === 0) context += `- Countdown: It's Christmas Day! We are in Boston together.\n`;
            }
            return context;
        }

        async function getFullSystemPrompt() {
            const context = await getContextPrompt();
            return `${BASE_PROMPT}${context}`;
        }

        // Auth Functions
        async function checkAuth() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                currentUser = session.user;
                console.log('Current user:', currentUser);
                console.log('Avatar URL:', currentUser.user_metadata?.avatar_url);

                // Show sidebar on desktop
                if (window.innerWidth >= 768) {
                    document.getElementById('sidebar').classList.remove('hidden');
                }

                await loadChatSessions();
            } else {
                // Redirect to login page
                window.location.href = 'index.html';
            }
        }


        async function handleLogout() {
            await supabaseClient.auth.signOut();
            window.location.href = 'index.html';
        }

        async function loadChatHistory() {
            if (!currentUser || !currentSessionId) return;

            const { data, error } = await supabaseClient
                .from('ask_tim_chats')
                .select('*')
                .eq('session_id', currentSessionId)
                .order('created_at', { ascending: true });

            if (data && data.length > 0) {
                chatHistory = data.map(msg => ({
                    role: msg.role,
                    content: msg.content
                }));
            }
        }

        async function saveChatMessage(role, content) {
            if (!currentUser || !currentSessionId) return;

            await supabaseClient.from('ask_tim_chats').insert({
                session_id: currentSessionId,
                user_id: currentUser.id,
                role: role,
                content: content
            });
        }

        window.onload = () => {
            checkAuth();
            checkVerificationStatus();
        };

        function toggleSettings() {
            modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
            if (modal.style.display === 'flex') {
                loadModelSettings();
            }
        }

        async function loadModelSettings() {
            await loadAvailableModels();
        }

        async function loadAvailableModels() {
            const modelSelect = document.getElementById('ai-model-select');
            modelSelect.innerHTML = '<option value="">Loading models...</option>';

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${HARDCODED_GEMINI_KEY}`);
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error?.message || 'Failed to load models');
                }

                // Filter models that support generateContent
                const supportedModels = data.models.filter(m =>
                    m.supportedGenerationMethods?.includes('generateContent')
                );

                if (supportedModels.length === 0) {
                    modelSelect.innerHTML = '<option value="">No models available</option>';
                    return;
                }

                modelSelect.innerHTML = '';
                supportedModels.forEach(model => {
                    const option = document.createElement('option');
                    option.value = model.name;
                    option.textContent = model.displayName || model.name;
                    modelSelect.appendChild(option);
                });

                // Load current session's model or saved model
                const session = chatSessions.find(s => s.id === currentSessionId);
                const savedModel = session?.model || localStorage.getItem('selected_model');
                if (savedModel && supportedModels.find(m => m.name === savedModel)) {
                    modelSelect.value = savedModel;
                } else {
                    // Default to gemini-2.5-flash if available, otherwise first model
                    const defaultModel = supportedModels.find(m => m.name === 'models/gemini-2.5-flash');
                    modelSelect.value = defaultModel ? defaultModel.name : supportedModels[0].name;
                }

            } catch (error) {
                console.error('Error loading models:', error);
                modelSelect.innerHTML = `<option value="">Error: ${error.message}</option>`;
            }
        }

        async function saveModelSettings() {
            const selectedModel = document.getElementById('ai-model-select').value;
            if (!selectedModel) {
                alert('Please select a model');
                return;
            }

            // Update current session's model
            if (currentSessionId) {
                await supabaseClient
                    .from('chat_sessions')
                    .update({ model: selectedModel })
                    .eq('id', currentSessionId);

                const session = chatSessions.find(s => s.id === currentSessionId);
                if (session) {
                    session.model = selectedModel;
                    renderChatList();
                }
            }

            localStorage.setItem('selected_model', selectedModel);
            toggleSettings();

            // Show confirmation
            const modelName = document.getElementById('ai-model-select').selectedOptions[0].text;
            console.log('Model changed to:', modelName);
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function handleImageSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                selectedImage = {
                    data: e.target.result,
                    mimeType: file.type
                };
                document.getElementById('preview-img').src = e.target.result;
                document.getElementById('image-preview').style.display = 'block';
            };
            reader.readAsDataURL(file);
        }

        function clearImagePreview() {
            selectedImage = null;
            document.getElementById('image-preview').style.display = 'none';
            document.getElementById('image-input').value = '';
        }

        function renderHistory() {
            chatHistory.forEach(msg => {
                appendMessage(msg.role === 'user' ? 'user' : 'tim', msg.content);
            });
            scrollToBottom();
        }

        function appendMessage(role, text) {
            const div = document.createElement('div');
            div.className = `message ${role}`;

            // Add avatar
            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';

            if (role === 'tim') {
                avatar.innerHTML = '🤖';
            } else {
                // Try multiple sources for avatar
                const avatarUrl = currentUser?.user_metadata?.avatar_url ||
                                 currentUser?.user_metadata?.picture ||
                                 currentUser?.identities?.[0]?.identity_data?.avatar_url;

                console.log('Trying avatar URL:', avatarUrl);

                if (avatarUrl) {
                    const img = document.createElement('img');
                    img.src = avatarUrl;
                    img.className = 'message-avatar';
                    img.onerror = () => {
                        console.error('Failed to load avatar:', avatarUrl);
                        avatar.textContent = currentUser?.email?.charAt(0).toUpperCase() || 'U';
                    };
                    avatar.replaceWith(img);
                } else {
                    avatar.textContent = currentUser?.email?.charAt(0).toUpperCase() || 'U';
                }
            }

            // Add message content
            const content = document.createElement('div');
            content.className = 'message-content';

            // Render markdown for Tim's messages, plain text for user messages
            if (role === 'tim') {
                content.innerHTML = marked.parse(text);
            } else {
                content.innerText = text;
            }

            div.appendChild(avatar);
            div.appendChild(content);
            chatContainer.appendChild(div);
            scrollToBottom();
        }

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function sendMessage() {
            const text = chatInput.value.trim();
            const hasImage = selectedImage !== null;

            if (!text && !hasImage) return;

            // Check if this is the first message and user hasn't been verified
            if (chatHistory.length === 0 && !isVerified) {
                // Store message and show captcha modal
                pendingMessage = {
                    text: text,
                    image: hasImage ? selectedImage : null
                };

                // Clear input
                chatInput.value = '';

                // Show captcha modal
                document.getElementById('captcha-modal').style.display = 'flex';
                return;
            }

            // If verified or not first message, proceed normally
            await sendMessageAfterVerification(text, hasImage ? selectedImage : null);
        }

        async function sendMessageAfterVerification(text, image = null) {
            const hasImage = image !== null;

            // Clear input if not already cleared
            chatInput.value = '';

            // Display user message with image if present
            if (hasImage) {
                appendMessageWithImage('user', text, image.data);
            } else {
                appendMessage('user', text);
            }

            chatHistory.push({
                role: 'user',
                content: text,
                image: hasImage ? image : null
            });
            await saveChatMessage('user', text);

            // Typing indicator
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message tim';
            typingDiv.innerHTML = '<div class="typing-indicator"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
            chatContainer.appendChild(typingDiv);
            scrollToBottom();

            try {
                const response = await callAI(text, hasImage ? image : null);
                chatContainer.removeChild(typingDiv);
                appendMessage('tim', response);
                chatHistory.push({ role: 'assistant', content: response });
                await saveChatMessage('assistant', response);

                // Auto-generate title for new chats after first message
                const session = chatSessions.find(s => s.id === currentSessionId);
                if (session && session.title === 'New Chat' && chatHistory.length === 2) {
                    const title = await generateChatTitle(text);
                    await updateSessionTitle(currentSessionId, title);
                }

                // Clear image after sending
                if (hasImage) {
                    clearImagePreview();
                }
            } catch (error) {
                chatContainer.removeChild(typingDiv);
                appendMessage('tim', "Sorry, I'm having trouble connecting to the AI service right now.");
                console.error(error);
            }
        }

        function appendMessageWithImage(role, text, imageSrc) {
            const div = document.createElement('div');
            div.className = `message ${role}`;

            // Add avatar
            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';

            if (role === 'tim') {
                avatar.innerHTML = '🤖';
            } else {
                // Try multiple sources for avatar
                const avatarUrl = currentUser?.user_metadata?.avatar_url ||
                                 currentUser?.user_metadata?.picture ||
                                 currentUser?.identities?.[0]?.identity_data?.avatar_url;

                console.log('Trying avatar URL:', avatarUrl);

                if (avatarUrl) {
                    const img = document.createElement('img');
                    img.src = avatarUrl;
                    img.className = 'message-avatar';
                    img.onerror = () => {
                        console.error('Failed to load avatar:', avatarUrl);
                        avatar.textContent = currentUser?.email?.charAt(0).toUpperCase() || 'U';
                    };
                    avatar.replaceWith(img);
                } else {
                    avatar.textContent = currentUser?.email?.charAt(0).toUpperCase() || 'U';
                }
            }

            // Add message content with image
            const content = document.createElement('div');
            content.className = 'message-content';

            const imgEl = document.createElement('img');
            imgEl.src = imageSrc;
            imgEl.style.maxWidth = '100%';
            imgEl.style.width = '100%';
            imgEl.style.height = 'auto';
            imgEl.style.borderRadius = '0.5rem';
            imgEl.style.marginBottom = '0.5rem';
            imgEl.style.display = 'block';
            content.appendChild(imgEl);

            if (text) {
                const textEl = document.createElement('div');
                textEl.innerText = text;
                content.appendChild(textEl);
            }

            div.appendChild(avatar);
            div.appendChild(content);
            chatContainer.appendChild(div);
            scrollToBottom();
        }

        async function callAI(text, image = null) {
            // Get model from current session, fallback to localStorage or default
            const session = chatSessions.find(s => s.id === currentSessionId);
            const selectedModel = session?.model || localStorage.getItem('selected_model') || 'models/gemini-2.5-flash';
            return await callGemini(HARDCODED_GEMINI_KEY, text, selectedModel, image);
        }

        async function callOpenAI(key, text, model = 'gpt-4o') {
            const response = await fetch('https://api.openai.com/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${key}`
                },
                body: JSON.stringify({
                    model: model,
                    messages: [
                        { role: 'system', content: await getFullSystemPrompt() },
                        ...chatHistory
                    ]
                })
            });
            const data = await response.json();

            // Better error handling
            if (!response.ok) {
                console.error('OpenAI API Error:', data);
                throw new Error(data.error?.message || 'API request failed');
            }

            if (!data.choices || !data.choices[0]?.message?.content) {
                console.error('Unexpected OpenAI response:', data);
                throw new Error('Invalid response format from OpenAI');
            }

            return data.choices[0].message.content;
        }

        async function callGemini(key, text, modelName, image = null) {
            const url = `https://generativelanguage.googleapis.com/v1beta/${modelName}:generateContent?key=${key}`;

            // Build message with system prompt
            const systemPrompt = await getFullSystemPrompt();

            // Format contents for Gemini
            const contents = [];

            // If this is the first message, include system prompt
            if (chatHistory.length === 1) {
                const parts = [{ text: `${systemPrompt}\n\nUser: ${chatHistory[0].content}` }];

                // Add image if present
                if (image) {
                    const base64Data = image.data.split(',')[1];
                    parts.push({
                        inline_data: {
                            mime_type: image.mimeType,
                            data: base64Data
                        }
                    });
                }

                contents.push({
                    role: 'user',
                    parts: parts
                });
            } else {
                // Add all chat history
                chatHistory.forEach(msg => {
                    const parts = [{ text: msg.content }];

                    // Add image if this message has one
                    if (msg.image) {
                        const base64Data = msg.image.data.split(',')[1];
                        parts.push({
                            inline_data: {
                                mime_type: msg.image.mimeType,
                                data: base64Data
                            }
                        });
                    }

                    contents.push({
                        role: msg.role === 'user' ? 'user' : 'model',
                        parts: parts
                    });
                });
            }

            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents })
            });
            const data = await response.json();

            // Better error handling
            if (!response.ok) {
                console.error('Gemini API Error:', data);
                throw new Error(data.error?.message || 'API request failed');
            }

            if (!data.candidates || !data.candidates[0]?.content?.parts?.[0]?.text) {
                console.error('Unexpected Gemini response:', data);
                throw new Error('Invalid response format from Gemini');
            }

            return data.candidates[0].content.parts[0].text;
        }

        // Session Management Functions
        let currentSessionId = null;
        let chatSessions = [];

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.querySelector('.sidebar-overlay');
            sidebar.classList.toggle('hidden');
            overlay.classList.toggle('active');
        }

        async function loadChatSessions() {
            if (!currentUser) return;

            const { data, error } = await supabaseClient
                .from('chat_sessions')
                .select('*')
                .eq('user_id', currentUser.id)
                .order('updated_at', { ascending: false });

            if (data) {
                chatSessions = data;
                renderChatList();

                // If no current session, create one or load the most recent
                if (!currentSessionId) {
                    if (data.length > 0) {
                        await switchToSession(data[0].id);
                    } else {
                        await createNewChat();
                    }
                }
            }
        }

        function renderChatList() {
            const chatListEl = document.getElementById('chat-list');
            chatListEl.innerHTML = '';

            chatSessions.forEach(session => {
                const div = document.createElement('div');
                div.className = `chat-item ${session.id === currentSessionId ? 'active' : ''}`;
                div.onclick = () => switchToSession(session.id);

                const updatedDate = new Date(session.updated_at);
                const timeAgo = getTimeAgo(updatedDate);

                div.innerHTML = `
                    <div class="chat-item-content">
                        <div class="chat-item-title">${session.title}</div>
                        <div class="chat-item-meta">${session.model.replace('models/', '')} • ${timeAgo}</div>
                    </div>
                    <button class="delete-chat-btn" onclick="event.stopPropagation(); deleteSession('${session.id}')">×</button>
                `;

                chatListEl.appendChild(div);
            });
        }

        function getTimeAgo(date) {
            const seconds = Math.floor((new Date() - date) / 1000);
            if (seconds < 60) return 'Just now';
            const minutes = Math.floor(seconds / 60);
            if (minutes < 60) return `${minutes}m ago`;
            const hours = Math.floor(minutes / 60);
            if (hours < 24) return `${hours}h ago`;
            const days = Math.floor(hours / 24);
            if (days < 7) return `${days}d ago`;
            return date.toLocaleDateString();
        }

        async function createNewChat() {
            if (!currentUser) return;

            // Get selected model or use default
            const selectedModel = localStorage.getItem('selected_model') || 'models/gemini-2.5-flash';

            const { data, error } = await supabaseClient
                .from('chat_sessions')
                .insert({
                    user_id: currentUser.id,
                    title: 'New Chat',
                    model: selectedModel
                })
                .select()
                .single();

            if (data) {
                chatSessions.unshift(data);
                await switchToSession(data.id);
                renderChatList();
            }
        }

        async function switchToSession(sessionId) {
            currentSessionId = sessionId;
            chatHistory = [];
            chatContainer.innerHTML = '';

            // Add welcome message
            const welcomeDiv = document.createElement('div');
            welcomeDiv.className = 'message tim';
            welcomeDiv.innerHTML = `
                <div class="message-avatar">🤖</div>
                <div class="message-content">Hi! I'm Tim's AI assistant. How can I help you today?</div>
            `;
            chatContainer.appendChild(welcomeDiv);

            // Load messages for this session
            await loadChatHistory();
            renderHistory();
            renderChatList();
        }

        async function deleteSession(sessionId) {
            if (!confirm('Delete this chat? This cannot be undone.')) return;

            const { error } = await supabaseClient
                .from('chat_sessions')
                .delete()
                .eq('id', sessionId);

            if (!error) {
                chatSessions = chatSessions.filter(s => s.id !== sessionId);

                if (currentSessionId === sessionId) {
                    // Switch to another session or create new
                    if (chatSessions.length > 0) {
                        await switchToSession(chatSessions[0].id);
                    } else {
                        await createNewChat();
                    }
                } else {
                    renderChatList();
                }
            }
        }

        async function generateChatTitle(firstMessage) {
            try {
                const prompt = `Generate a short, concise title (max 4 words) for a chat that starts with: "${firstMessage}". Reply with only the title, no quotes or extra text.`;
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash-exp:generateContent?key=${HARDCODED_GEMINI_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ role: 'user', parts: [{ text: prompt }] }]
                    })
                });
                const data = await response.json();
                return data.candidates[0].content.parts[0].text.trim();
            } catch (error) {
                console.error('Error generating title:', error);
                return firstMessage.substring(0, 30) + (firstMessage.length > 30 ? '...' : '');
            }
        }

        async function updateSessionTitle(sessionId, title) {
            await supabaseClient
                .from('chat_sessions')
                .update({ title })
                .eq('id', sessionId);

            const session = chatSessions.find(s => s.id === sessionId);
            if (session) {
                session.title = title;
                renderChatList();
            }
        }
    </script>
