<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shared Calendar | Timothy & Ugo</title>
    <script>
        if (!sessionStorage.getItem('authenticated')) {
            window.location.href = 'index.html';
        }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background-color: #F9FAFB;
        }

        /* Calendar Grid */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 1px;
            background-color: #E5E7EB;
            border: 1px solid #E5E7EB;
            border-radius: 12px;
            overflow: hidden;
        }

        .calendar-day {
            background-color: white;
            min-height: 120px;
            padding: 8px;
            transition: background-color 0.2s;
            cursor: pointer;
            position: relative;
        }

        .calendar-day:hover {
            background-color: #F9FAFB;
        }

        .calendar-day.today {
            background-color: #FFFAF0;
        }

        .calendar-day.other-month {
            background-color: #F9FAFB;
            color: #9CA3AF;
        }

        .day-number {
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 4px;
            display: inline-block;
            width: 24px;
            height: 24px;
            text-align: center;
            line-height: 24px;
            border-radius: 50%;
        }

        .calendar-day.today .day-number {
            background-color: #C07F63;
            color: white;
        }

        /* Event Pills */
        .event-pill {
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: 4px;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .event-pill:hover {
            transform: scale(1.02);
            z-index: 10;
        }

        .event-date {
            background-color: #FEE2E2;
            color: #991B1B;
            border-left: 3px solid #EF4444;
        }

        .event-trip {
            background-color: #ECFDF5;
            color: #065F46;
            border-left: 3px solid #10B981;
        }

        .event-milestone {
            background-color: #FEF3C7;
            color: #92400E;
            border-left: 3px solid #F59E0B;
        }

        .event-apartment {
            background-color: #EFF6FF;
            color: #1E40AF;
            border-left: 3px solid #3B82F6;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            border-radius: 16px;
            padding: 24px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            transform: scale(0.95);
            transition: transform 0.2s;
        }

        .modal.open .modal-content {
            transform: scale(1);
        }

        .type-option {
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
        }

        .type-option.selected {
            border-color: #C07F63;
            background-color: #FFF7ED;
        }
    </style>
</head>

<body>
    <!-- Header -->
    <header class="bg-white border-b border-gray-100 sticky top-0 z-50"
        style="backdrop-filter: blur(12px); background: rgba(255,255,255,0.95);">
        <div class="container mx-auto px-5 py-4 flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold text-gray-900 tracking-tight">Our Calendar</h1>
                <p class="text-xs text-gray-500 font-medium mt-0.5" id="headerDate">December 2025</p>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="changeMonth(-1)" class="p-2 hover:bg-gray-100 rounded-full transition-colors">
                    <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                    </svg>
                </button>
                <button onclick="goToToday()"
                    class="text-sm font-semibold text-brand-orange hover:text-orange-700 transition-colors">Today</button>
                <button onclick="changeMonth(1)" class="p-2 hover:bg-gray-100 rounded-full transition-colors">
                    <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                    </svg>
                </button>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="openAddModal()"
                    class="hidden md:flex items-center gap-2 px-4 py-2 bg-brand-orange text-white rounded-xl hover:bg-orange-700 transition-all text-sm font-semibold shadow-sm">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                    </svg>
                    New Event
                </button>
                <a href="main.html" class="p-2 text-gray-400 hover:text-gray-900 transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </a>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-5 py-8 max-w-6xl">
        <!-- Weekday Headers -->
        <div class="grid grid-cols-7 gap-1 mb-2">
            <div class="text-center text-xs font-semibold text-gray-400 uppercase tracking-wider py-2">Sun</div>
            <div class="text-center text-xs font-semibold text-gray-400 uppercase tracking-wider py-2">Mon</div>
            <div class="text-center text-xs font-semibold text-gray-400 uppercase tracking-wider py-2">Tue</div>
            <div class="text-center text-xs font-semibold text-gray-400 uppercase tracking-wider py-2">Wed</div>
            <div class="text-center text-xs font-semibold text-gray-400 uppercase tracking-wider py-2">Thu</div>
            <div class="text-center text-xs font-semibold text-gray-400 uppercase tracking-wider py-2">Fri</div>
            <div class="text-center text-xs font-semibold text-gray-400 uppercase tracking-wider py-2">Sat</div>
        </div>

        <!-- Calendar Grid -->
        <div class="calendar-grid" id="calendarGrid">
            <!-- Days injected via JS -->
        </div>

        <!-- Upcoming Widget (Mobile Only) -->
        <div class="md:hidden mt-8">
            <h3 class="text-lg font-bold text-gray-900 mb-4">Up Next</h3>
            <div id="mobileUpcomingList" class="space-y-3">
                <!-- Upcoming events injected here -->
            </div>
        </div>
    </main>

    <!-- Add Event Modal -->
    <div id="eventModal" class="modal">
        <div class="modal-content">
            <h3 class="text-xl font-bold text-gray-900 mb-4">Add Event</h3>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Title</label>
                    <input type="text" id="eventTitle"
                        class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-brand-orange"
                        placeholder="Dinner at Moxy...">
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Date</label>
                    <input type="date" id="eventDate"
                        class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-brand-orange">
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-2">Type</label>
                    <div class="grid grid-cols-2 gap-2">
                        <div class="type-option p-2 rounded-lg border border-gray-200 flex items-center gap-2"
                            onclick="selectType('date')">
                            <span class="w-3 h-3 rounded-full bg-red-500"></span>
                            <span class="text-sm font-medium">Date Night</span>
                        </div>
                        <div class="type-option p-2 rounded-lg border border-gray-200 flex items-center gap-2"
                            onclick="selectType('trip')">
                            <span class="w-3 h-3 rounded-full bg-emerald-500"></span>
                            <span class="text-sm font-medium">Trip</span>
                        </div>
                        <div class="type-option p-2 rounded-lg border border-gray-200 flex items-center gap-2"
                            onclick="selectType('milestone')">
                            <span class="w-3 h-3 rounded-full bg-amber-500"></span>
                            <span class="text-sm font-medium">Milestone</span>
                        </div>
                        <div class="type-option p-2 rounded-lg border border-gray-200 flex items-center gap-2"
                            onclick="selectType('apartment')">
                            <span class="w-3 h-3 rounded-full bg-blue-500"></span>
                            <span class="text-sm font-medium">Apartment</span>
                        </div>
                    </div>
                </div>

                <div class="flex gap-3 mt-6">
                    <button onclick="closeModal()"
                        class="flex-1 py-2.5 bg-gray-100 text-gray-700 rounded-xl font-semibold text-sm hover:bg-gray-200 transition-colors">Cancel</button>
                    <button onclick="saveEvent()"
                        class="flex-1 py-2.5 bg-brand-orange text-white rounded-xl font-semibold text-sm hover:bg-orange-700 transition-colors">Save</button>
                </div>
            </div>
        </div>
    </div>

    <!-- View Event Modal -->
    <div id="viewModal" class="modal">
        <div class="modal-content">
            <div class="flex justify-between items-start mb-4">
                <h3 class="text-xl font-bold text-gray-900" id="viewTitle">Event Title</h3>
                <button onclick="deleteEvent()"
                    class="text-red-500 hover:text-red-700 text-sm font-medium">Delete</button>
            </div>
            <p class="text-gray-500 text-sm mb-6" id="viewDate">Date string</p>
            <div class="flex gap-3">
                <button onclick="closeModal()"
                    class="flex-1 py-2.5 bg-gray-100 text-gray-700 rounded-xl font-semibold text-sm hover:bg-gray-200 transition-colors">Close</button>
            </div>
        </div>
    </div>

    <script>
        let currentDate = new Date();
        let events = JSON.parse(localStorage.getItem('shared_calendar_events') || '[]');
        let selectedType = 'date';
        let viewId = null;

        // Ensure default events exist if empty
        if (events.length === 0) {
            events = [
                { id: 1, title: 'First Christmas Together', date: '2025-12-25', type: 'milestone' },
                { id: 2, title: 'Move-in Day', date: '2026-02-01', type: 'apartment' },
                { id: 3, title: 'Boston Trip', date: '2025-12-24', type: 'trip' }
            ];
            localStorage.setItem('shared_calendar_events', JSON.stringify(events));
        }

        window.onload = () => {
            renderCalendar();
            selectType('date'); // Default selection visual
        };

        function renderCalendar() {
            const grid = document.getElementById('calendarGrid');
            const header = document.getElementById('headerDate');
            grid.innerHTML = '';

            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            header.innerText = new Date(year, month).toLocaleString('default', { month: 'long', year: 'numeric' });

            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);

            // Days from prev month
            const startingDay = firstDay.getDay();
            const prevMonthLastDay = new Date(year, month, 0).getDate();

            for (let i = 0; i < startingDay; i++) {
                const dayDiv = document.createElement('div');
                dayDiv.className = 'calendar-day other-month';
                dayDiv.innerHTML = `<span class="day-number">${prevMonthLastDay - startingDay + 1 + i}</span>`;
                grid.appendChild(dayDiv);
            }

            // Days of current month
            const today = new Date();
            for (let i = 1; i <= lastDay.getDate(); i++) {
                const dayDiv = document.createElement('div');
                dayDiv.className = 'calendar-day';
                if (i === today.getDate() && month === today.getMonth() && year === today.getFullYear()) {
                    dayDiv.classList.add('today');
                }

                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;

                // Add click to add event
                dayDiv.onclick = (e) => {
                    if (e.target === dayDiv || e.target.classList.contains('day-number')) {
                        openAddModal(dateStr);
                    }
                };

                let html = `<span class="day-number">${i}</span>`;

                // Check for events
                const dayEvents = events.filter(e => e.date === dateStr);
                dayEvents.forEach(e => {
                    html += `<div class="event-pill event-${e.type}" onclick="openViewModal('${e.id}', event)">${e.title}</div>`;
                });

                dayDiv.innerHTML = html;
                grid.appendChild(dayDiv);
            }
        }

        function changeMonth(delta) {
            currentDate.setMonth(currentDate.getMonth() + delta);
            renderCalendar();
        }

        function goToToday() {
            currentDate = new Date();
            renderCalendar();
        }

        /* Modal Functions */
        function openAddModal(date = '') {
            document.getElementById('eventTitle').value = '';
            document.getElementById('eventDate').value = date || new Date().toISOString().split('T')[0];
            document.getElementById('eventModal').style.display = 'flex';
            setTimeout(() => document.getElementById('eventModal').classList.add('open'), 10);
            selectType('date');
        }

        function openViewModal(id, e) {
            e.stopPropagation();
            const event = events.find(ev => ev.id == id);
            if (!event) return;

            viewId = event.id;
            document.getElementById('viewTitle').innerText = event.title;
            document.getElementById('viewDate').innerText = new Date(event.date).toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            document.getElementById('viewModal').style.display = 'flex';
            setTimeout(() => document.getElementById('viewModal').classList.add('open'), 10);
        }

        function closeModal() {
            document.querySelectorAll('.modal').forEach(m => {
                m.classList.remove('open');
                setTimeout(() => m.style.display = 'none', 200);
            });
        }

        function selectType(type) {
            selectedType = type;
            document.querySelectorAll('.type-option').forEach(el => el.classList.remove('selected'));
            // Simple logic to highlight selected (in reality would use IDs or data attrs)
            const index = ['date', 'trip', 'milestone', 'apartment'].indexOf(type);
            document.querySelectorAll('.type-option')[index].classList.add('selected');
        }

        function saveEvent() {
            const title = document.getElementById('eventTitle').value;
            const date = document.getElementById('eventDate').value;

            if (!title || !date) return alert('Please fill in all fields');

            events.push({
                id: Date.now().toString(),
                title,
                date,
                type: selectedType
            });

            localStorage.setItem('shared_calendar_events', JSON.stringify(events));
            renderCalendar();
            closeModal();
        }

        function deleteEvent() {
            if (!viewId) return;
            events = events.filter(e => e.id != viewId);
            localStorage.setItem('shared_calendar_events', JSON.stringify(events));
            renderCalendar();
            closeModal();
        }
    </script>
</body>

</html>
